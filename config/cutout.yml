# Background removal, for content types marked transparent (and any batch
# asked for it): a service of its own, called on each image after ComfyUI
# renders it (Cutout). Without a URL, backgrounds are kept.
#
# The default speaks rembg's HTTP API: `rembg s --host 0.0.0.0 --port 7000`
# (pip install "rembg[gpu,cli]"), which runs BiRefNet, ISNet, BRIA RMBG and
# others. Any service that takes the image as a multipart `file` field
# (and the model as `model`) and answers with a PNG works the same way.
# From inside a container, a service on the host is usually
# http://host.docker.internal:<port>.
shared: &shared
  # The service's base URL.
  url: <%= ENV.fetch("CUTOUT_URL", "") %>
  # Where on it the image goes.
  path: <%= ENV.fetch("CUTOUT_PATH", "/api/remove").to_json %>
  # The model to ask for, as the service names it (rembg: birefnet-general,
  # isnet-anime for flat illustrated art, bria-rmbg, u2net, ...).
  model: <%= ENV.fetch("CUTOUT_MODEL", "birefnet-general").to_json %>
  # Sent as "Authorization: Bearer ..." when set.
  token: <%= ENV.fetch("CUTOUT_TOKEN", "").to_json %>
  # Seconds to wait: the first image loads the model.
  timeout: <%= ENV.fetch("CUTOUT_TIMEOUT", "120") %>

development:
  <<: *shared
test:
  <<: *shared
  url: http://cutout.test
  token: ""
production:
  <<: *shared
