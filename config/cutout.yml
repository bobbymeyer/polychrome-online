# Background removal, for content types marked transparent (and any batch
# asked for it): a service of its own, called on each image after ComfyUI
# renders it (Cutout). Without a URL, backgrounds are kept.
#
# The default speaks rembg's HTTP API, the standalone tool that runs the
# removal models (ISNet, BiRefNet, BRIA RMBG, U²-Net) behind one API:
# `bin/cutout` installs it, fetches the model and serves it on port 7000
# (`bin/cutout check` sends a picture through). Any service that takes the
# image as a multipart `file` field (and the model as `model`) and answers
# with a PNG works the same way. From inside a container, a service on the
# host is usually http://host.docker.internal:<port>.
shared: &shared
  # The service's base URL.
  url: <%= ENV.fetch("CUTOUT_URL", "") %>
  # Where on it the image goes.
  path: <%= ENV.fetch("CUTOUT_PATH", "/api/remove").to_json %>
  # The model to ask for, as the service names it. rembg's: isnet-anime
  # (made for flat illustrated art, ~170 MB, a few seconds and ~2 GB of RAM
  # on a CPU; the default), isnet-general-use (the same, for any picture),
  # birefnet-general (the finest edges; ~1 GB, and without a GPU a minute a
  # picture in 16 GB+ of RAM), bria-rmbg, u2net.
  model: <%= ENV.fetch("CUTOUT_MODEL", "isnet-anime").to_json %>
  # Sent as "Authorization: Bearer ..." when set.
  token: <%= ENV.fetch("CUTOUT_TOKEN", "").to_json %>
  # Seconds to wait for one picture: the first loads the model, and a big
  # model on a CPU takes a minute.
  timeout: <%= ENV.fetch("CUTOUT_TIMEOUT", "300") %>
  # The colour the picture is rendered on when it will be cut out, in place
  # of the type's white background: a flat ground no character design is
  # drawn in, so the white in a design (a shirt, a face, a sail) is never
  # mistaken for the background. Blank keeps each type's own framing (white),
  # and only white closed in by the subject can be told from the ground.
  ground: <%= ENV.fetch("CUTOUT_GROUND", "green").to_json %>
  # How far (0–255, per channel) a cleared pixel's colour may be from the
  # ground's and still count as background. Cleared pixels further from it
  # than this were taken out of the subject, and are put back.
  tolerance: <%= ENV.fetch("CUTOUT_TOLERANCE", "56") %>

development:
  <<: *shared
test:
  <<: *shared
  url: http://cutout.test
  token: ""
production:
  <<: *shared
