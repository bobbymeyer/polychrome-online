# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  hello: "Hello world"
  # What a form's button says (f.submit): a sentence in the game's words, not
  # "Create Npc" or "Update Scene". An edit saves; something new says where it goes.
  helpers:
    submit:
      create: "Create %{model}"
      update: "Save changes"
      campaign:
        create: "Create campaign"
      npc:
        create: "Add to the cast"
      scene:
        create: "Save scene"
      job:
        create: "Create archetype"
      monster:
        create: "Add to the bestiary"
      item:
        create: "Add to the armory"
      ability:
        create: "Add to the grimoire"
      location_template:
        create: "Add to the gazetteer"
      encounter_table:
        create: "Create encounter table"
      generator_table:
        create: "Create table"
      world_place:
        create: "Add to the atlas"
      world_figure:
        create: "Add to the cast"
      world_front:
        create: "Create front"
      codex_entry:
        create: "Add to the codex"
      world:
        create: "Create world"
  # Jobs are called archetypes wherever a player or GM reads them (the code keeps Job).
  activerecord:
    models:
      job:
        one: Archetype
        other: Archetypes
      character_job: Archetype level
    attributes:
      character:
        job: Archetype
        job_id: Archetype
      character_job:
        job: Archetype
      job_level:
        job: Archetype
        level: Archetype level
