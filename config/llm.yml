# An optional language model for drafts and suggestions (Draft). Without a
# URL there are none, and everything else works the same.
#
# Any server with an OpenAI-compatible chat API works: llama.cpp's
# llama-server, llama-swap, Ollama (http://host:11434/v1), LM Studio, vLLM,
# or a hosted API. From inside a container, a server on the host is usually
# http://host.docker.internal:<port>/v1.
shared: &shared
  # The API's base URL, up to and including /v1.
  url: <%= ENV.fetch("LLM_URL", "") %>
  # The model to ask for, as the server names it (llama-swap and Ollama
  # route by it). Blank lets the server pick.
  model: <%= ENV.fetch("LLM_MODEL", "").to_json %>
  # Sent as "Authorization: Bearer ..." when set.
  token: <%= ENV.fetch("LLM_TOKEN", "").to_json %>
  # Any other headers, as a JSON object.
  headers: <%= ENV.fetch("LLM_HEADERS", "{}").to_json %>
  # Seconds to wait: a server may have to load the model first.
  timeout: <%= ENV.fetch("LLM_TIMEOUT", "120") %>

development:
  <<: *shared
test:
  <<: *shared
  url: ""
production:
  <<: *shared
